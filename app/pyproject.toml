# Settings for the quality tools (not a package - just tool config)

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# E/W = style (pycodestyle), F = bugs like unused imports (pyflakes),
# I = sorted imports, B = common bug patterns (bugbear), S = security (bandit)
select = ["E", "W", "F", "I", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest works, and tests use a fixed dev password
"tests/*" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["db: needs the MariaDB container (run with RUN_DB_TESTS=1)"]
